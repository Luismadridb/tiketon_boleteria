<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Boletería-Sistema de Reservas</title>
  </head>
  <body>
    <div id="app">
      <header class="marquee">
        <h1 class="marquee-title">Ticketon</h1>
        <p class="marquee-sub">Boletería-Sistema de Reservas</p>
      </header>

      <main>
        <section class="window-panel">
          <div class="window-label">
            <span>Ventanilla</span>
          </div>
          <form id="form-reserva" novalidate>
            <label for="sel-evento">Evento</label>
            <select id="sel-evento" name="evento">
              <option value="">Cargando eventos disponibles...</option>
            </select>

            <label for="txt-nombre">A nombre de</label>
            <input id="txt-nombre" name="nombre" type="text" placeholder="Camila Soto" />

            <label for="txt-cantidad">Entradas</label>
            <input id="txt-cantidad" name="cantidad" type="number" min="1" placeholder="2" />

            <button type="submit">Emitir reserva</button>
            <p id="bloque-error" class="error-text"></p>
          </form>
        </section>

        <section class="stubs-panel">
          <div class="stubs-header">
            <h2>Tickets emitidos</h2>
            <button id="btn-recargar" type="button">↻ Actualizar</button>
          </div>
          <div id="contenedor-catalogo"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
